name: Go Unit Tests

on:
  push:
    branches: [ main ] # Or your default branch
  pull_request:
    branches: [ main ] # Or your default branch

jobs:
  test: # Renamed from build to test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.17'
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run unit tests
        run: go test ./... # Updated command

  build: # New build job
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.17'
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build
        run: go build ./...
